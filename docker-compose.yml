services:
  web:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY . .
        CMD ["python", "-m", "http.server", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "http://localhost:8000"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 5s
