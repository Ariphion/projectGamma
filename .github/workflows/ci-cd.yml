name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build Stage (Verify asset structure)
        run: |
          echo "Building static website assets..."
          ls -la

      - name: Test Stage (Run unit tests)
        run: |
          node test_site.js

      - name: Deploy Stage (Placeholder for Vercel integration)
        run: |
          echo "Deployment stage reached successfully!"